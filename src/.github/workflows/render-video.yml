name: Render Rick Clips Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Render video
        run: npm run render

      - name: Upload finished video
        uses: actions/upload-artifact@v4
        with:
          name: rick-clips-video
          path: out/video.mp4
          if-no-files-found: error
